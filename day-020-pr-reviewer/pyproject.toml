[project]
name = "pr-reviewer"
version = "0.1.0"
description = "Day 020: an ADK agent that reviews one public GitHub pull request, read-only, via a public MCP server."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12,<3",
    "mcp>=1.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]
