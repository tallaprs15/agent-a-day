[project]
name = "web-qa-explorer"
version = "0.1.0"
description = "Day 004: an ADK agent that explores a web app with Playwright MCP, asks before risky actions, and files an evidence-checked bug report."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12,<3",
    "mcp>=1.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]
