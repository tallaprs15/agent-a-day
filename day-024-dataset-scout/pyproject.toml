[project]
name = "dataset-scout"
version = "0.1.0"
description = "Day 024: an ADK agent that finds and explains Hugging Face datasets for a task, with every fact traced to a tool result."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12,<3",
    "mcp>=1.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
    "ignore:.*is deprecated in favor of Workflow:DeprecationWarning",
]
