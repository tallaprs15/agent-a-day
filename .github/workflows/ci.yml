name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test every agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}  # optional; live tests skip without it
        run: |
          for d in day-*/; do
            echo "::group::$d"
            (cd "$d" && uv sync -q && uv run pytest -q) || exit 1
            echo "::endgroup::"
          done

  index:
    if: github.event_name == 'push'
    needs: [secrets, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate progress table and playground
        run: |
          python3 scripts/update_index.py
          uv run --python 3.12 --no-project python scripts/sync_playground.py
          (cd playground && uv lock -q)
          git add -A README.md playground
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update agent index and playground"
            git push
          fi
