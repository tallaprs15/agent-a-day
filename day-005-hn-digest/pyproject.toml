[project]
name = "hn-digest"
version = "0.1.0"
description = "Day 005: an ADK agent that writes a Hacker News digest and remembers what it already covered, using a knowledge-graph memory MCP server."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12,<3",
    "mcp>=1.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]
