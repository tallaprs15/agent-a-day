[project]
name = "meeting-planner"
version = "0.1.0"
description = "Day 006: an ADK agent that finds meeting slots across time zones and returns a typed, verified plan using the time MCP server."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12,<3",
    "mcp>=1.20",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]
